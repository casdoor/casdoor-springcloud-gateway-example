<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf_header" th:content="${csrfToken.headerName}">
    <meta name="_csrf" th:content="${csrfToken.token}">
    <title>Casdoor Spring Cloud Gateway Example</title>
</head>
<body>
<h1>Casdoor Spring Cloud Gateway Example</h1>

<div th:if="${user == null}">
    <p>The APIs behind the gateway need a signed-in user.</p>
    <a th:href="@{/oauth2/authorization/casdoor}">Login with Casdoor</a>
</div>

<div th:if="${user != null}">
    <p>Signed in as <b th:text="${user.name}">user</b> (<span th:text="${user.email}">email</span>)</p>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>

<p>
    <button type="button" onclick="callApi('GET', '/api/resource/getResource')">Get Resource</button>
    <button type="button" onclick="callApi('POST', '/api/resource/updateResource')">Update Resource</button>
</p>
<pre id="res"></pre>

<script>
    function callApi(method, url) {
        const headers = {};
        if (method !== 'GET') {
            headers[document.querySelector('meta[name="_csrf_header"]').content] =
                document.querySelector('meta[name="_csrf"]').content;
        }
        fetch(url, {method, headers})
            .then(res => {
                if (res.status === 401) {
                    document.getElementById('res').textContent = '401 Unauthorized, please login first';
                    return;
                }
                return res.json().then(data => document.getElementById('res').textContent = JSON.stringify(data, null, 2));
            })
            .catch(e => document.getElementById('res').textContent = String(e));
    }
</script>
</body>
</html>
