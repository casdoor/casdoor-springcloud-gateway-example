server:
  port: 9090

spring:
  application:
    name: casdoor-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: api-route
              uri: http://localhost:9091
              predicates:
                - Path=/api/**
              filters:
                # pass the access token of the signed-in user to the API as "Authorization: Bearer ..."
                - TokenRelay=

# The Casdoor application, the defaults are the public demo server https://door.casdoor.com
